table:
  name: atlas_connection
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: dev
    permission:
      columns:
        - connected_at
        - last_error
        - last_synced_at
        - user_id
      filter:
        user_id:
          _eq: X-Hasura-User-Id
    comment: own status only; the token columns are never exposed
  - role: user
    permission:
      columns:
        - connected_at
        - last_error
        - last_synced_at
        - user_id
      filter:
        user_id:
          _eq: X-Hasura-User-Id
    comment: own status only; the token columns are never exposed
